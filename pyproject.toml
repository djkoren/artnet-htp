[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artnet-htp"
version = "0.3.8"
description = "ArtNet HTP (Highest Takes Priority) merger for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
artnet-htp = "artnet_htp.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artnet_htp = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["src/artnet_htp/tests"]
asyncio_mode = "auto"
