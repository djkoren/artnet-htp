# Default config baked into the image. The merger boots with empty source/
# output/universe lists so it does nothing harmful out of the box — you
# configure it via the web UI at http://artnet-htp.local/ after first
# boot, OR drop a pre-made `artnet-htp-config.yaml` on the SD card's boot
# partition before first boot and the first-boot service will import it.

bind_ip: 0.0.0.0
send_rate_hz: 44
source_timeout_s: 2.5
send_keepalive_when_silent: true
auto_allow_unknown_sources: false

sources: []
outputs: []
# v0.3.0+: universes live on each output (output.universes), not at the config
# root. Empty outputs list = nothing tracked yet. Add an output via the web UI
# and set its Start/End to start merging.

web:
  host: 0.0.0.0
  port: 80

node:
  short_name: "HTP Merger"
  long_name: "ArtNet HTP Merger (Pi)"
