name: Build Pi SD card image

# Triggered on tag push (e.g. v0.2.0, v1.0.0-beta1).
# Produces an artnet-htp-<tag>.img.xz file (via pi-gen) and attaches it to
# the GitHub Release for the same tag. The release is auto-created.
#
# Also supports manual workflow_dispatch for debugging — picks up the tip of
# `main` and outputs a release tagged with the run ID.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach to (e.g. v0.0.1-debug). Empty = no release, just the artifact.'
        required: false
        default: ''

# pi-gen needs to be cloned at a pinned commit so a surprise upstream change
# can't break our builds. Bump this deliberately.
env:
  PI_GEN_REPO: RPi-Distro/pi-gen
  PI_GEN_REF: 4ad56cc850fa60adcc7f07dc15879bc95cc1d281   # arm64 branch, 2026-04-16

permissions:
  contents: write   # needed to attach assets to the Release

jobs:
  build:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag/name for this build
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="manual-${{ github.run_id }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_name=artnet-htp-${TAG}" >> "$GITHUB_OUTPUT"
          echo "Build tag: $TAG"

      - name: Free up runner disk
        run: |
          # pi-gen needs ~15-20GB free during build (rootfs work copy + final
          # image + apt caches). The default GH runner image has ~14GB free,
          # but ~10GB of that is preinstalled toolchains we don't use.
          sudo rm -rf /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/Java_* \
                      /opt/hostedtoolcache/dotnet \
                      /opt/hostedtoolcache/go || true
          sudo apt-get clean
          df -h /

      - name: Install pi-gen build dependencies
        run: |
          # Full dep list from pi-gen's README + binfmt activation. pi-gen runs
          # an internal `dependencies_check` that exits non-zero with a hint
          # naming the specific package — keep this list complete.
          sudo apt-get update -qq
          # Pi-gen requires qemu-user-binfmt specifically (its dependency_check
          # rejects qemu-user-static even though both packages provide qemu).
          # The two conflict, so install only qemu-user-binfmt here.
          sudo apt-get install -y --no-install-recommends \
            quilt parted \
            qemu-user-binfmt binfmt-support \
            debootstrap zerofree zip dosfstools libarchive-tools \
            libcap2-bin grep rsync xz-utils file git curl bc \
            qemu-utils kpartx gpg pigz arch-test \
            coreutils psmisc
          # Confirm aarch64 binfmt is registered (qemu-user-binfmt registers
          # automatically via dpkg trigger; this is just a visibility step).
          sudo update-binfmts --display qemu-aarch64 | head -5 || true

      - name: Clone pi-gen at pinned commit
        run: |
          git clone --no-checkout https://github.com/${{ env.PI_GEN_REPO }} pi-gen
          cd pi-gen
          git checkout "${{ env.PI_GEN_REF }}"
          echo "pi-gen HEAD: $(git rev-parse HEAD)"

      - name: Apply our pi-gen config + sync custom stage
        run: |
          # Drop our config in as `config` at the pi-gen root.
          cp image/pi-gen-config pi-gen/config
          # Override IMG_NAME with the resolved tag so the output filename
          # includes the version.
          echo "IMG_NAME=${{ steps.vars.outputs.image_name }}" >> pi-gen/config

          # Copy our custom stage into pi-gen's tree. Pi-gen iterates stages
          # by directory at the project root, so this is where they need to
          # live during the build.
          cp -a image/stage-artnet-htp pi-gen/

          # Sync our source tree into the stage's files/ dir so 00-run.sh
          # can rsync it into the chroot. Exclude the venv, git, image
          # build files, and the workflow files themselves.
          install -d pi-gen/stage-artnet-htp/files
          rsync -a --delete \
            --exclude='.venv' --exclude='__pycache__' --exclude='.pytest_cache' \
            --exclude='*.pyc' --exclude='.git' --exclude='image' \
            --exclude='.github' --exclude='pi-gen' \
            ./ pi-gen/stage-artnet-htp/files/artnet-htp-src/

          # Copy the firstboot service + script (kept under image/ in the
          # repo so they don't ship inside the running merger's source tree).
          cp -a image/firstboot pi-gen/stage-artnet-htp/files/firstboot

          # Bake a build-info.json into the stage so 00-run.sh can copy it to
          # /etc/artnet-htp/. Surfaced at runtime by /api/version.
          cat > pi-gen/stage-artnet-htp/files/build-info.json <<EOF
          {
            "version": "${{ steps.vars.outputs.tag }}",
            "git_sha": "${{ github.sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "image": "${{ steps.vars.outputs.image_name }}"
          }
          EOF

          echo "===== final pi-gen config ====="
          cat pi-gen/config
          echo "===== stage-artnet-htp ====="
          ls -la pi-gen/stage-artnet-htp/
          ls -la pi-gen/stage-artnet-htp/files/ | head
          echo "==============================="

      - name: Build image (this is the slow part — 25-40min)
        run: |
          cd pi-gen
          # build.sh wants root for chroot + mount operations.
          sudo ./build.sh
          echo "===== build output ====="
          ls -lh deploy/

      - name: Locate output image
        id: locate
        run: |
          IMG_XZ=$(ls pi-gen/deploy/*.img.xz 2>/dev/null | head -1)
          if [ -z "$IMG_XZ" ]; then
            echo "::error::No .img.xz produced. Listing deploy/ for diagnosis:"
            ls -la pi-gen/deploy/ || true
            exit 1
          fi
          echo "img_xz=$IMG_XZ" >> "$GITHUB_OUTPUT"
          ls -lh "$IMG_XZ"

      - name: Emit build-info.json
        run: |
          cat > build-info.json <<EOF
          {
            "version": "${{ steps.vars.outputs.tag }}",
            "git_sha": "${{ github.sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "image": "${{ steps.vars.outputs.image_name }}"
          }
          EOF
          cat build-info.json

      - name: Upload as workflow artifact (also for manual_dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.image_name }}
          path: |
            ${{ steps.locate.outputs.img_xz }}
            build-info.json
          retention-days: 14

      - name: Attach to GitHub Release (tag pushes only)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.locate.outputs.img_xz }}
            build-info.json
          # Tags with a "-" suffix (e.g. v0.0.1-test) are prereleases so they
          # don't show as the "Latest" on the repo page.
          prerelease: ${{ contains(steps.vars.outputs.tag, '-') }}
